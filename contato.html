    <div class="container">
        <section class="intro">
            <h2>Sobre o Projeto e Contato</h2>
            <p style="margin-bottom: 20px;">

                Em caso de dúvidas ou sugestões, entre em contato conosco através do formulário abaixo.</p>

            <form action="#" method="post" style="max-width: 600px; margin: 0 auto;">
                <div class="form-grupo">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-grupo">
                    <label for="email">Seu E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-grupo">
                    <label for="mensagem">Mensagem ou Dúvida:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Como podemos ajudar?"
                        required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </section>
    </div>

    <footer>
        <p><strong>Projeto de TCC - Regina</strong> | Curso de [Nome do Seu Curso] - 2026</p>
